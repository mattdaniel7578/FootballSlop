services:
  - type: web
    name: footballslop
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: footballslop-db
          property: connectionString
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ODDS_API_KEY
        sync: false
      - key: SEASON_START_DATE
        sync: false
      - key: ODDS_SYNC_MINUTES
        value: 60
      - key: ADMIN_EMAILS
        value: mattdaniel7578@gmail.com

databases:
  - name: footballslop-db
    plan: basic-256mb
